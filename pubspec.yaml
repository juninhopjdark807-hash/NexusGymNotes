name: nexus_gym_notes
description: "Nexus Gym — registro de treinos de musculação. Rápido, offline, minimalista."
publish_to: 'none'
version: 0.1.0+1

environment:
  # Compatível com Dart 3.13.2 / Flutter 3.47.2 (stable do ambiente de destino).
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Estado da aplicação (separado da interface e da persistência)
  flutter_riverpod: ^2.6.1
  # Persistência local (SQLite), offline, sem servidor.
  # path + getDatabasesPath (sqflite) — sem path_provider, para evitar
  # o pacote transitivo objective_c (build hook quebra no Windows com
  # espaço no caminho do usuário, ex.: C:\Users\Paulo Jr\).
  path: ^1.9.0
  sqflite: ^2.4.1
  # Identificadores únicos (prontos para futura sincronização)
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
